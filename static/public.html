<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tix - 提交工单</title>
  <script src="/sober.min.js?v=20260316-public-01"></script>
  <style>
    :root {
      --md-sys-color-primary: #0f766e;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #ccfbf1;
      --md-sys-color-on-primary-container: #134e4a;
      --md-sys-color-secondary: #155e75;
      --md-sys-color-surface: rgba(255, 255, 255, 0.9);
      --md-sys-color-surface-strong: #ffffff;
      --md-sys-color-on-surface: #0f172a;
      --md-sys-color-on-surface-variant: #475569;
      --md-sys-color-outline: rgba(148, 163, 184, 0.5);
      --md-sys-color-background: #ecfeff;
      --md-sys-color-success: #15803d;
      --md-sys-color-danger: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--md-sys-color-on-surface);
      background:
        radial-gradient(circle at top, rgba(45, 212, 191, 0.28), transparent 32rem),
        linear-gradient(180deg, #f0fdfa 0%, #ecfeff 40%, #f8fafc 100%);
    }

    s-card,
    s-text-field,
    s-picker,
    s-button,
    s-snackbar {
      --s-color-primary: var(--md-sys-color-primary);
      --s-color-on-primary: var(--md-sys-color-on-primary);
      --s-color-outline: var(--md-sys-color-outline);
      --s-color-surface: var(--md-sys-color-surface-strong);
      --s-color-on-surface: var(--md-sys-color-on-surface);
      --s-color-surface-container: #f0fdfa;
      --s-color-on-surface-variant: var(--md-sys-color-on-surface-variant);
    }

    .page {
      width: min(100%, 32rem);
      margin: 0 auto;
      padding: max(1rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
    }

    .hero {
      padding: 1.25rem 0 1rem;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      min-height: 2rem;
      padding: 0.25rem 0.8rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: #0f766e;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    h1 {
      margin: 0.9rem 0 0.55rem;
      font-size: clamp(1.9rem, 8vw, 2.5rem);
      line-height: 1.04;
      letter-spacing: -0.04em;
    }

    .hero p {
      margin: 0;
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.7;
      font-size: 0.95rem;
    }

    s-card.form-card {
      display: block;
      padding: 1rem;
      border-radius: 1.5rem;
      border: 1px solid var(--md-sys-color-outline);
      background: var(--md-sys-color-surface);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 44px rgba(15, 23, 42, 0.08);
    }

    .section-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .section-text {
      margin: 0.4rem 0 1rem;
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.6;
      font-size: 0.9rem;
    }

    .form {
      display: grid;
      gap: 0.9rem;
    }

    .form s-text-field,
    .form s-picker,
    .form s-button {
      width: 100%;
    }

    .sms-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.75rem;
      align-items: start;
    }

    .sms-row s-button {
      width: auto;
      min-width: 7.5rem;
      align-self: stretch;
    }

    .helper {
      font-size: 0.82rem;
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.5;
    }

    .error {
      min-height: 1.25rem;
      color: var(--md-sys-color-danger);
      font-size: 0.84rem;
    }

    .success {
      display: grid;
      gap: 0.9rem;
      padding: 1rem;
      border-radius: 1rem;
      background: rgba(220, 252, 231, 0.75);
      color: #14532d;
    }

    .success strong {
      font-size: 1rem;
    }

    .success-meta {
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .tips {
      display: grid;
      gap: 0.7rem;
      margin-top: 1rem;
    }

    .tip {
      padding: 0.9rem 1rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid rgba(148, 163, 184, 0.24);
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.55;
      font-size: 0.88rem;
    }

    [hidden] {
      display: none !important;
    }

    @media (min-width: 768px) {
      .page {
        width: min(100%, 52rem);
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(19rem, 24rem);
        gap: 1.25rem;
        align-items: start;
      }

      .hero {
        padding-top: 2.5rem;
      }

      s-card.form-card {
        padding: 1.25rem;
      }
    }

    @media (max-width: 480px) {
      .sms-row {
        grid-template-columns: 1fr;
      }

      .sms-row s-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="layout">
      <section class="hero">
        <span class="eyebrow">扫码即可提交</span>
        <h1>公开工单入口</h1>
        <p>无需登录，适合贴在设备旁、前台桌牌或二维码海报。填写问题描述并选择分类后即可提交。</p>

        <div class="tips">
          <div class="tip">建议把设备编号、位置、报错现象写清楚，处理会更快。</div>
          <div class="tip">联系方式选填。留手机号、工位号、微信号等任一可联系信息即可。</div>
        </div>
      </section>

      <s-card class="form-card" type="filled">
        <div id="formView">
          <h2 class="section-title">新建工单</h2>
          <p class="section-text">表单已针对手机端优化，在 375px 宽度下也能完整操作。</p>

          <form id="ticketForm" class="form">
            <s-picker id="categoryInput" label="分类" placeholder="请选择分类"></s-picker>
            <s-text-field id="contentInput" type="multiline" rows="5" label="问题描述" placeholder="例如：二楼打印机卡纸，屏幕显示 E32，重新开机后仍无法打印。" max-length="5000"></s-text-field>
            <s-text-field id="contactInput" label="联系方式（可选）" placeholder="例如：13800000000 / 微信 / 工位 A-12" max-length="50"></s-text-field>
            <div class="helper">联系方式最多 50 个字符，不填则会以匿名方式提交。</div>
            <div class="sms-row">
              <s-text-field id="phoneInput" label="手机号" placeholder="请输入 11 位手机号" inputmode="numeric" max-length="11"></s-text-field>
              <s-button id="smsCodeBtn" type="filled-tonal">获取验证码</s-button>
            </div>
            <s-text-field id="smsCodeInput" label="短信验证码" placeholder="请输入 6 位验证码" inputmode="numeric" max-length="6"></s-text-field>
            <div class="helper">当前为测试模式，接口会记录日志并返回固定验证码，后续可直接接入真实短信服务。</div>
            <div id="errorText" class="error"></div>
            <s-button id="submitBtn" type="filled">提交工单</s-button>
          </form>
        </div>

        <div id="successView" hidden>
          <div class="success">
            <strong>提交成功</strong>
            <div id="successMessage" class="success-meta"></div>
            <s-button id="againBtn" type="filled-tonal">继续提交</s-button>
          </div>
        </div>
      </s-card>
    </div>
  </main>

  <s-snackbar id="snackbar"></s-snackbar>

  <script>
    const API = '/v1/public';
    const ticketForm = document.getElementById('ticketForm');
    const categoryInput = document.getElementById('categoryInput');
    const contentInput = document.getElementById('contentInput');
    const contactInput = document.getElementById('contactInput');
    const phoneInput = document.getElementById('phoneInput');
    const smsCodeInput = document.getElementById('smsCodeInput');
    const smsCodeBtn = document.getElementById('smsCodeBtn');
    const submitBtn = document.getElementById('submitBtn');
    const errorText = document.getElementById('errorText');
    const formView = document.getElementById('formView');
    const successView = document.getElementById('successView');
    const successMessage = document.getElementById('successMessage');
    const againBtn = document.getElementById('againBtn');
    const snackbar = document.getElementById('snackbar');
    let smsCountdown = 0;
    let smsTimer = null;

    function normalizePhone(phone) {
      return String(phone || '').trim().replace(/\s+/g, '').replace(/-/g, '').replace(/^\+86/, '');
    }

    function isValidPhone(phone) {
      return /^1\d{10}$/.test(normalizePhone(phone));
    }

    function showToast(message) {
      snackbar.textContent = message;
      snackbar.show();
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      submitBtn.textContent = loading ? '提交中...' : '提交工单';
    }

    function setSMSButtonState() {
      const counting = smsCountdown > 0;
      smsCodeBtn.disabled = counting;
      smsCodeBtn.textContent = counting ? `${smsCountdown}s 后重试` : '获取验证码';
    }

    function startSMSCountdown() {
      smsCountdown = 60;
      setSMSButtonState();
      clearInterval(smsTimer);
      smsTimer = setInterval(() => {
        smsCountdown -= 1;
        if (smsCountdown <= 0) {
          clearInterval(smsTimer);
          smsTimer = null;
          smsCountdown = 0;
        }
        setSMSButtonState();
      }, 1000);
    }

    function renderCategories(items) {
      const safeItems = Array.isArray(items) ? items.filter(Boolean) : [];
      categoryInput.replaceChildren();

      safeItems.forEach((item) => {
        const option = document.createElement('s-picker-item');
        option.value = item;
        option.textContent = item;
        categoryInput.append(option);
      });
    }

    async function loadCategories() {
      const res = await fetch(`${API}/categories`);
      if (!res.ok) {
        throw new Error('加载分类失败');
      }
      const data = await res.json();
      renderCategories(data.items || []);
    }

    function resetForm() {
      categoryInput.value = '';
      contentInput.value = '';
      contactInput.value = '';
      phoneInput.value = '';
      smsCodeInput.value = '';
      errorText.textContent = '';
      formView.hidden = false;
      successView.hidden = true;
      clearInterval(smsTimer);
      smsTimer = null;
      smsCountdown = 0;
      setSMSButtonState();
    }

    async function requestSMSCode(event) {
      event.preventDefault();
      errorText.textContent = '';

      const phone = normalizePhone(phoneInput.value);
      if (!isValidPhone(phone)) {
        errorText.textContent = '请输入正确的 11 位手机号。';
        return;
      }

      smsCodeBtn.disabled = true;
      try {
        const res = await fetch(`${API}/sms/code?phone=${encodeURIComponent(phone)}`);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          errorText.textContent = data?.error?.message || '验证码发送失败，请稍后重试。';
          smsCodeBtn.disabled = false;
          setSMSButtonState();
          return;
        }

        startSMSCountdown();
        showToast(data.code ? `测试验证码：${data.code}` : (data.message || '验证码已发送'));
      } catch (error) {
        smsCodeBtn.disabled = false;
        setSMSButtonState();
        errorText.textContent = '网络异常，请稍后重试。';
      }
    }

    async function submitTicket(event) {
      event.preventDefault();
      errorText.textContent = '';

      const payload = {
        category: categoryInput.value.trim(),
        content: contentInput.value.trim(),
        contact: contactInput.value.trim(),
        phone: normalizePhone(phoneInput.value),
        sms_code: smsCodeInput.value.trim(),
      };

      if (!payload.category) {
        errorText.textContent = '请选择分类。';
        return;
      }
      if (!payload.content) {
        errorText.textContent = '请填写问题描述。';
        return;
      }
      if (!isValidPhone(payload.phone)) {
        errorText.textContent = '请输入正确的 11 位手机号。';
        return;
      }
      if (!payload.sms_code) {
        errorText.textContent = '请输入短信验证码。';
        return;
      }

      setLoading(true);
      try {
        const res = await fetch(`${API}/tickets`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(payload),
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          errorText.textContent = data?.error?.message || '提交失败，请稍后重试。';
          return;
        }

        formView.hidden = true;
        successView.hidden = false;
        successMessage.textContent = `${data.message} 工单号：${data.id}，分类：${data.category}。`;
        showToast('工单已提交');
      } catch (error) {
        errorText.textContent = '网络异常，请稍后重试。';
      } finally {
        setLoading(false);
      }
    }

    ticketForm.addEventListener('submit', submitTicket);
    smsCodeBtn.addEventListener('click', requestSMSCode);
    againBtn.addEventListener('click', resetForm);
    setSMSButtonState();

    loadCategories().catch(() => {
      errorText.textContent = '分类加载失败，请刷新页面后重试。';
      showToast('分类加载失败');
    });
  </script>
</body>
</html>
